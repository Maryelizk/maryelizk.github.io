<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    var target = "/UmbralCavern";
    var path = window.location.pathname;
    if (path.toLowerCase().indexOf(target.toLowerCase()) === 0 && path.indexOf(target) !== 0) {
      window.location.replace(
        target + path.slice(target.length) + window.location.search + window.location.hash
      );
    }
  </script>
</head>
<body>
  <p>Looking for the party? Go to
    <a href="/UmbralCavern/">maryelizk.github.io/UmbralCavern/</a></p>
</body>
</html>
